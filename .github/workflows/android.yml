name: Android app

on:
  push:
    tags: ['app-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle the course site into the app (works offline)
        run: |
          D=android/app/src/main/assets/site
          rm -rf "$D" && mkdir -p "$D/vendor"
          cp index.html lectures-1-3.html "$D/"
          cp -r assets "$D/assets"
          # The classic Lectures 1-3 page loads libraries from CDNs: ship local copies.
          cd "$D/vendor"
          curl -fsSL -o bootstrap.min.css https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css
          curl -fsSL -o bootstrap.bundle.min.js https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js
          curl -fsSL -o chart.umd.min.js https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js
          curl -fsSL -o highlight.min.js https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js
          curl -fsSL -o atom-one-dark.min.css https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css
          mkdir -p fonts
          curl -fsSL -o bootstrap-icons.min.css https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css
          curl -fsSL -o fonts/bootstrap-icons.woff2 https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/fonts/bootstrap-icons.woff2
          curl -fsSL -o fonts/bootstrap-icons.woff https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/fonts/bootstrap-icons.woff
          cd - >/dev/null
          sed -i \
            -e 's#https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css#vendor/bootstrap.min.css#g' \
            -e 's#https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js#vendor/bootstrap.bundle.min.js#g' \
            -e 's#https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js#vendor/chart.umd.min.js#g' \
            -e 's#https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js#vendor/highlight.min.js#g' \
            -e 's#https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css#vendor/atom-one-dark.min.css#g' \
            -e 's#https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css#vendor/bootstrap-icons.min.css#g' \
            "$D/lectures-1-3.html"
          grep -c 'vendor/' "$D/lectures-1-3.html"
          du -sh "$D"

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "Release key found"
          else
            echo "::warning::KEYSTORE_B64 secret not set - APK is signed with a temporary debug key"
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: cc-course
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/app-v') && github.ref_name || format('1.0.{0}', github.run_number) }}
        run: |
          VERSION_NAME="${VERSION_NAME#app-v}"
          export VERSION_NAME
          gradle --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../CompilerConstruction.apk
          ls -l ../CompilerConstruction.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CompilerConstruction-apk
          path: CompilerConstruction.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" CompilerConstruction.apk \
            --title "Compiler Construction app ${GITHUB_REF_NAME#app-v}" \
            --notes "Android app for the Compiler Construction course: all 30 sessions, midterm and final units, slides, animations, Watch mode, lab tools, quizzes, assignments, flashcards and glossary. Works offline. Download CompilerConstruction.apk on the phone and open it to install (allow installing from this source when Android asks)."
