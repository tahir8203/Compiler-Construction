plugins { id 'com.android.application' }

def ksFile = System.getenv('KEYSTORE_FILE')

android {
    namespace 'com.tahir.compilerconstruction'
    compileSdk 36
    defaultConfig {
        applicationId 'com.tahir.compilerconstruction'
        minSdk 23
        targetSdk 34
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName(System.getenv('VERSION_NAME') ?: '1.0.0')
    }
    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storeType 'pkcs12'
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
